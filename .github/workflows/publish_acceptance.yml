name: Publish component set on acceptance

on:
  push:
    branches:
      - acceptance
    tags:
      - 'v*'
    paths-ignore:
      - 'CHANGELOG.md'
      - 'package.json'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
        with:
          token: ${{ secrets.GH_TOKEN }}
      - uses: oven-sh/setup-bun@v2
        with:
          # Pinned: @betty-blocks/cli publishes via the legacy @azure/storage-blob v10
          # SDK, whose polyfilled AbortSignal is rejected by Bun >= 1.4.0 fetch
          # ("signal is not of type AbortSignal"). Unpin once the CLI moves to
          # @azure/storage-blob v12.
          bun-version: 1.3.14
      - name: Install packages
        run: bun install

      - name: build
        run: bun run build

      - name: bundle
        run: bun run bundle

      - name: upload
        env:
          AZURE_BLOB_ACCOUNT: ${{ secrets.AZURE_BLOB_ACCOUNT_ACCEPTANCE }}
          AZURE_BLOB_ACCOUNT_KEY: ${{ secrets.AZURE_BLOB_ACCOUNT_KEY_ACCEPTANCE }}
        run: bun run upload
      - name: release notes
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
        run: bunx semantic-release
