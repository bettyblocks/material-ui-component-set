name: Material UI testing and linting

on: [push]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      # jsdoc (via @betty-blocks/cli) calls util.isRegExp, removed in Node 23;
      # ubuntu-latest now ships Node 24.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install packages
        run: bun install

      - name: Lint
        run: bun run lint:ci
      - name: Build test
        run: |
          bun run bundle
          bun run build
